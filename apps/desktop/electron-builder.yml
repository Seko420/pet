appId: com.empiregameforge.app
productName: Empire Game Forge AI
# npm-Workspaces hoisten node_modules ins Root - Version daher explizit
# (muss zur electron-Version im package-lock.json passen).
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: EmpireGameForge-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Empire Game Forge AI
  artifactName: EmpireGameForge-Setup-${version}.${ext}
portable:
  artifactName: EmpireGameForge-Portable-${version}.${ext}
mac:
  icon: build/icon.png
  # Kein arch hier: jeder Runner baut seine NATIVE Architektur (Intel-Runner
  # -> x64, Apple-Silicon-Runner -> arm64). So passen die nativen Module
  # (better-sqlite3) garantiert zur Ziel-CPU - keine Cross-Kompilierung.
  target:
    - dmg
  # Ad-hoc-signiert (kein Apple-Developer-Zertifikat noetig).
  identity: null
  category: public.app-category.developer-tools
  artifactName: EmpireGameForge-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
npmRebuild: true
publish: null
