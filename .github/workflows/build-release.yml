name: Windows-Installer bauen

# Baut die installierbare Windows-App (Setup + portable EXE).
# - Bei einem Tag "v*" wird zusätzlich ein GitHub-Release mit den Dateien erstellt.
# - Manuell startbar über den "Run workflow"-Button (Actions-Tab).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Defender-Ausnahme (app-builder.exe False-Positive)
        # Windows Defender auf den Runnern quarantäniert app-builder.exe
        # (bekannter False-Positive) -> ENOENT beim electron-builder.
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
        shell: powershell

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        # npm install statt npm ci: das Lockfile wurde unter Linux erzeugt,
        # npm ci lässt dann Windows-spezifische optionale Binärpakete
        # (app-builder-bin) weg - install löst sie plattformgerecht auf.
        run: npm install --no-audit --no-fund

      - name: Tests und Typecheck
        run: |
          npm run typecheck
          npm test

      - name: Installer bauen (NSIS + portable)
        run: npm run dist

      - name: Artefakte hochladen (Actions-Tab)
        uses: actions/upload-artifact@v4
        with:
          name: EmpireGameForge-Windows
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error

      - name: GitHub-Release erstellen (nur bei v*-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          generate_release_notes: true

  build-macos:
    # GitHubs Intel-Runner (macos-13) sind kaum noch verfuegbar. Wir bauen
    # daher BEIDE Architekturen auf einem Apple-Silicon-Runner (macos-14) in
    # GETRENNTEN Durchgaengen - so wird das native Modul (better-sqlite3) je
    # Ziel-CPU korrekt gebaut (im Gegensatz zum fehlerhaften Ein-Durchgang-
    # Dual-Build, der arm64-Binaries ins Intel-Paket legte).
    runs-on: macos-14
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Renderer bauen
        run: npm run build -w apps/desktop

      - name: Apple-Chip-DMG bauen (arm64)
        working-directory: apps/desktop
        run: npx electron-builder --mac dmg --arm64 --config electron-builder.yml

      - name: Intel-DMG bauen (x64)
        working-directory: apps/desktop
        run: npx electron-builder --mac dmg --x64 --config electron-builder.yml

      - name: Prüfen, dass eine echte Intel-Version (x86_64) entstanden ist
        working-directory: apps/desktop
        run: |
          echo "Gefundene SQLite-Module:"
          find release -name "better_sqlite3.node" -exec sh -c 'echo "-- $1"; file "$1"' _ {} \;
          if find release -name "better_sqlite3.node" -exec file {} \; | grep -q "x86_64"; then
            echo "OK: x86_64-Version vorhanden - Intel-Macs werden unterstuetzt."
          else
            echo "FEHLER: keine x86_64-Version des nativen Moduls - Intel-Build waere abgestuerzt."
            exit 1
          fi

      - name: Artefakt hochladen (Actions-Tab)
        uses: actions/upload-artifact@v4
        with:
          name: EmpireGameForge-macOS
          path: |
            apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: GitHub-Release ergänzen (nur bei v*-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.dmg
          generate_release_notes: true
