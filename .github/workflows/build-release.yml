name: Windows-Installer bauen

# Baut die installierbare Windows-App (Setup + portable EXE).
# - Bei einem Tag "v*" wird zusätzlich ein GitHub-Release mit den Dateien erstellt.
# - Manuell startbar über den "Run workflow"-Button (Actions-Tab).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Defender-Ausnahme (app-builder.exe False-Positive)
        # Windows Defender auf den Runnern quarantäniert app-builder.exe
        # (bekannter False-Positive) -> ENOENT beim electron-builder.
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
        shell: powershell

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        # npm install statt npm ci: das Lockfile wurde unter Linux erzeugt,
        # npm ci lässt dann Windows-spezifische optionale Binärpakete
        # (app-builder-bin) weg - install löst sie plattformgerecht auf.
        run: npm install --no-audit --no-fund

      - name: Tests und Typecheck
        run: |
          npm run typecheck
          npm test

      - name: Installer bauen (NSIS + portable)
        run: npm run dist

      - name: Artefakte hochladen (Actions-Tab)
        uses: actions/upload-artifact@v4
        with:
          name: EmpireGameForge-Windows
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error

      - name: GitHub-Release erstellen (nur bei v*-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          generate_release_notes: true

  build-macos:
    # Jede Architektur wird auf NATIVER Hardware gebaut, damit die nativen
    # Module (better-sqlite3) exakt zur Ziel-CPU passen:
    #   macos-13  = Intel (x64)   ->  EmpireGameForge-Mac-Intel
    #   macos-14  = Apple Silicon ->  EmpireGameForge-Mac-AppleChip
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            label: Intel
          - runner: macos-14
            label: AppleChip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: macOS-App bauen (native Architektur)
        run: npm run dist:mac -w apps/desktop

      - name: Artefakt hochladen (Actions-Tab)
        uses: actions/upload-artifact@v4
        with:
          name: EmpireGameForge-Mac-${{ matrix.label }}
          path: |
            apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: GitHub-Release ergänzen (nur bei v*-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.dmg
          generate_release_notes: true
