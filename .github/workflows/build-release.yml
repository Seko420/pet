name: Windows-Installer bauen

# Baut die installierbare Windows-App (Setup + portable EXE).
# - Bei einem Tag "v*" wird zusätzlich ein GitHub-Release mit den Dateien erstellt.
# - Manuell startbar über den "Run workflow"-Button (Actions-Tab).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Defender-Ausnahme (app-builder.exe False-Positive)
        # Windows Defender auf den Runnern quarantäniert app-builder.exe
        # (bekannter False-Positive) -> ENOENT beim electron-builder.
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
        shell: powershell

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        # npm install statt npm ci: das Lockfile wurde unter Linux erzeugt,
        # npm ci lässt dann Windows-spezifische optionale Binärpakete
        # (app-builder-bin) weg - install löst sie plattformgerecht auf.
        run: npm install --no-audit --no-fund

      - name: Tests und Typecheck
        run: |
          npm run typecheck
          npm test

      - name: Installer bauen (NSIS + portable)
        run: npm run dist

      - name: Artefakte hochladen (Actions-Tab)
        uses: actions/upload-artifact@v4
        with:
          name: EmpireGameForge-Windows
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error

      - name: GitHub-Release erstellen (nur bei v*-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          generate_release_notes: true
